<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Quick Build</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:#fff;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:550px;
  margin:auto;
  padding:18px;
}

.header{
  text-align:center;
  padding:20px 0;
}

.logo{
  width:65px;
  height:65px;
  margin:auto;
  border-radius:18px;
  background:linear-gradient(135deg,#00e5ff,#635bff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

h1{
  margin-top:12px;
  font-size:28px;
}

.subtitle{
  color:#94a3b8;
  margin-top:6px;
}

.card{
  background:#151c2f;
  border:1px solid #26324d;
  border-radius:20px;
  padding:18px;
  margin-top:15px;
}

label{
  display:block;
  margin-bottom:8px;
  color:#cbd5e1;
  font-size:14px;
}

input,
textarea{
  width:100%;
  border:none;
  outline:none;
  background:#0d1425;
  color:#fff;
  border:1px solid #293650;
  border-radius:12px;
  padding:14px;
  font-size:15px;
  margin-bottom:16px;
}

textarea{
  min-height:230px;
  resize:none;
  font-family:monospace;
}

input:focus,
textarea:focus{
  border-color:#00d9ff;
}

.file{
  padding:12px;
}

.preview{
  width:90px;
  height:90px;
  border-radius:18px;
  object-fit:cover;
  display:none;
  margin:5px 0 15px;
  border:2px solid #334155;
}

button{
  width:100%;
  border:none;
  padding:16px;
  border-radius:14px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.build{
  background:linear-gradient(135deg,#00e5ff,#635bff);
  color:#fff;
  margin-top:5px;
}

.build:active{
  transform:scale(.98);
}

.status{
  margin-top:18px;
  padding:14px;
  border-radius:12px;
  background:#0d1425;
  color:#94a3b8;
  text-align:center;
  display:none;
}

.success{
  color:#4ade80;
}

.error{
  color:#fb7185;
}

.download{
  display:none;
  margin-top:12px;
  background:#22c55e;
  color:#fff;
  text-decoration:none;
  text-align:center;
  padding:15px;
  border-radius:14px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">⚡</div>
    <h1>Quick Build</h1>
    <p class="subtitle">HTML to Android APK</p>
  </div>

  <div class="card">

    <label>App Name</label>
    <input
      id="appName"
      type="text"
      placeholder="My App"
      value="My App">

    <label>Package Name</label>
    <input
      id="packageName"
      type="text"
      placeholder="com.example.myapp"
      value="com.quickbuild.app">

    <label>Paste HTML</label>
    <textarea
      id="htmlCode"
      placeholder="Paste your complete HTML code here..."></textarea>

    <label>Select HTML File</label>
    <input
      id="htmlFile"
      class="file"
      type="file"
      accept=".html,.htm">

    <label>App Icon</label>
    <input
      id="iconFile"
      class="file"
      type="file"
      accept="image/*">

    <img id="iconPreview" class="preview">

    <label>Splash Screen</label>
    <input
      id="splashFile"
      class="file"
      type="file"
      accept="image/*">

    <img id="splashPreview" class="preview">

    <button
      class="build"
      onclick="buildAPK()">
      🚀 Build APK
    </button>

    <div id="status" class="status"></div>

    <a
      id="downloadBtn"
      class="download"
      href="#"
      download>
      ⬇️ Download APK
    </a>

  </div>

</div>

<script>

const htmlCode = document.getElementById("htmlCode");
const htmlFile = document.getElementById("htmlFile");

const iconFile = document.getElementById("iconFile");
const splashFile = document.getElementById("splashFile");

const iconPreview = document.getElementById("iconPreview");
const splashPreview = document.getElementById("splashPreview");

const statusBox = document.getElementById("status");
const downloadBtn = document.getElementById("downloadBtn");


/* HTML FILE */

htmlFile.addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){
    htmlCode.value = e.target.result;
  };

  reader.readAsText(file);
});


/* ICON PREVIEW */

iconFile.addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  iconPreview.src = URL.createObjectURL(file);
  iconPreview.style.display = "block";
});


/* SPLASH PREVIEW */

splashFile.addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  splashPreview.src = URL.createObjectURL(file);
  splashPreview.style.display = "block";
});


/* FILE TO BASE64 */

function fileToBase64(file){

  return new Promise((resolve,reject)=>{

    if(!file){
      resolve("");
      return;
    }

    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}


/* BUILD */

async function buildAPK(){

  const appName =
    document.getElementById("appName").value.trim();

  const packageName =
    document.getElementById("packageName").value.trim();

  const html =
    htmlCode.value.trim();


  if(!appName){

    showStatus(
      "Please enter App Name.",
      "error"
    );

    return;
  }


  if(!html){

    showStatus(
      "Please paste HTML code first.",
      "error"
    );

    return;
  }


  showStatus(
    "⏳ Preparing APK build...",
    ""
  );


  downloadBtn.style.display = "none";


  try{

    const icon =
      await fileToBase64(iconFile.files[0]);

    const splash =
      await fileToBase64(splashFile.files[0]);


    const data = {

      appName: appName,

      packageName:
        packageName || "com.quickbuild.app",

      html: html,

      css: "",

      javascript: "",

      url: "",

      icon: icon,

      splash: splash

    };


    const response =
      await fetch("/api/build",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify(data)

      });


    if(!response.ok){

      throw new Error(
        "Build server is not connected."
      );

    }


    const result =
      await response.json();


    if(!result.id){

      throw new Error(
        "Build ID was not returned."
      );

    }


    showStatus(
      "🔨 Building APK...",
      ""
    );


    checkBuild(result.id);


  }catch(error){

    showStatus(
      "❌ " + error.message,
      "error"
    );

  }

}


/* CHECK BUILD */

async function checkBuild(id){

  try{

    const response =
      await fetch(
        "/api/build/" + id
      );


    if(!response.ok){

      throw new Error(
        "Unable to check build status."
      );

    }


    const result =
      await response.json();


    if(
      result.status === "completed" ||
      result.status === "success"
    ){

      showStatus(
        "✅ APK Build Complete!",
        "success"
      );


      downloadBtn.href =
        "/api/download/" + id;

      downloadBtn.style.display =
        "block";

      return;

    }


    if(result.status === "failed"){

      showStatus(
        "❌ APK Build Failed.",
        "error"
      );

      return;

    }


    showStatus(
      "⏳ Building APK...",
      ""
    );


    setTimeout(
      () => checkBuild(id),
      3000
    );


  }catch(error){

    showStatus(
      "❌ " + error.message,
      "error"
    );

  }

}


/* STATUS */

function showStatus(message,type){

  statusBox.style.display = "block";

  statusBox.textContent = message;

  statusBox.className =
    "status " + type;

}

</script>

</body>
</html>
