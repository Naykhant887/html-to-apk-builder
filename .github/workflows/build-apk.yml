name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Get repository files
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install npm dependencies
      - name: Install dependencies
        run: npm install

      # 4. Make sure Capacitor packages exist
      - name: Install Capacitor
        run: |
          npm install @capacitor/core
          npm install @capacitor/cli
          npm install @capacitor/android

      # 5. Check web files
      - name: Check web files
        run: |
          test -f www/index.html
          echo "www/index.html found"

      # 6. Create Capacitor configuration
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.quickbuild.app",
            "appName": "Quick Build",
            "webDir": "www"
          }
          EOF

          echo "Capacitor config created:"
          cat capacitor.config.json

      # 7. Add Android platform
      - name: Add Android platform
        run: |
          npx cap add android

      # 8. Sync web files with Android
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # 9. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 10. Build Debug APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickBuild-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
